# ===== Database =====
# Set these as environment variables or in application-local.properties (never commit real credentials)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartServicebooking?createDatabaseIfNotExist=true}
spring.datasource.username=root
spring.datasource.password=Daulat@@6920
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool hardening
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ===== JPA =====
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== JWT =====
# Override JWT_SECRET with a strong random value in production environment variables
jwt.secret=${JWT_SECRET:SmartBookingSystemSecretKey2024ThatIsAtLeast256BitsLongForHS256SecurityAlgorithm}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===== Server =====
#server.port=8989

# ===== Actuator — expose only health endpoint publicly (locked down in SecurityConfig) =====
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
